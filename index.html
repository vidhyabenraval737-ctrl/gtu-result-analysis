<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTU Result & ATKT Risk System</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

  <!-- Navigation Bar -->
  <nav class="bg-blue-800 text-white p-4 shadow-lg">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">GTU Student Performance System</h1>
      <div class="space-x-2">
        <button onclick="switchRole('student')" id="btn-student" class="bg-white text-blue-800 px-4 py-2 rounded font-semibold shadow">Student View</button>
        <button onclick="switchRole('faculty')" id="btn-faculty" class="bg-blue-700 hover:bg-blue-600 px-4 py-2 rounded font-semibold">Faculty Portal</button>
      </div>
    </div>
  </nav>

  <div class="max-w-6xl mx-auto p-6">

    <!-- STUDENT VIEW -->
    <div id="student-view" class="block">
      
      <!-- Student Info & Risk Warning -->
      <div class="bg-white p-6 rounded-lg shadow-md mb-6">
        <div class="flex justify-between items-center">
          <div>
            <h2 class="text-2xl font-bold text-gray-800">Student Dashboard</h2>
            <p class="text-gray-600">Enrollment No: <span class="font-semibold">210010107001</span></p>
          </div>
          
          <!-- ATKT Risk Badge -->
          <div id="risk-badge" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg flex items-center space-x-2">
            <span class="text-2xl">⚠️</span>
            <div>
              <p class="font-bold">ATKT Risk Alert!</p>
              <p class="text-xs">Low marks detected in Mid-Sem/Internal. Immediate focus required.</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Semester Tabs (Sem 1 to 6) -->
      <div class="flex space-x-2 mb-4 border-b border-gray-300">
        <button onclick="showSem(1)" class="sem-tab bg-blue-600 text-white px-4 py-2 rounded-t font-semibold" id="tab-1">Sem 1</button>
        <button onclick="showSem(2)" class="sem-tab bg-gray-200 text-gray-700 px-4 py-2 rounded-t font-semibold" id="tab-2">Sem 2</button>
        <button onclick="showSem(3)" class="sem-tab bg-gray-200 text-gray-700 px-4 py-2 rounded-t font-semibold" id="tab-3">Sem 3</button>
        <button onclick="showSem(4)" class="sem-tab bg-gray-200 text-gray-700 px-4 py-2 rounded-t font-semibold" id="tab-4">Sem 4</button>
        <button onclick="showSem(5)" class="sem-tab bg-gray-200 text-gray-700 px-4 py-2 rounded-t font-semibold" id="tab-5">Sem 5</button>
        <button onclick="showSem(6)" class="sem-tab bg-gray-200 text-gray-700 px-4 py-2 rounded-t font-semibold" id="tab-6">Sem 6</button>
      </div>

      <!-- Marks Table -->
      <div class="bg-white rounded-lg shadow-md overflow-hidden">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-800 text-white text-sm">
              <th class="p-3">Subject Code</th>
              <th class="p-3">Subject Name</th>
              <th class="p-3">Mid-Sem (30)</th>
              <th class="p-3">Internal (20)</th>
              <th class="p-3">GTU Exam (70)</th>
              <th class="p-3">Status / Risk</th>
            </tr>
          </thead>
          <tbody id="marks-table-body" class="divide-y divide-gray-200">
            <!-- Data populated dynamically via JS -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- FACULTY VIEW -->
    <div id="faculty-view" class="hidden">
      <div class="bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold text-gray-800 mb-4">Faculty Mark Entry Portal</h2>
        
        <form id="mark-entry-form" onsubmit="saveMarks(event)" class="space-y-4 max-w-lg">
          <div>
            <label class="block font-semibold text-gray-700">Enrollment Number</label>
            <input type="text" id="fac-enrollment" value="210010107001" required class="w-full p-2 border border-gray-300 rounded mt-1">
          </div>

          <div>
            <label class="block font-semibold text-gray-700">Semester</label>
            <select id="fac-sem" class="w-full p-2 border border-gray-300 rounded mt-1">
              <option value="1">Semester 1</option>
              <option value="2">Semester 2</option>
              <option value="3">Semester 3</option>
            </select>
          </div>

          <div>
            <label class="block font-semibold text-gray-700">Subject</label>
            <input type="text" id="fac-subject" placeholder="e.g., Maths-1 (3110014)" required class="w-full p-2 border border-gray-300 rounded mt-1">
          </div>

          <div class="grid grid-cols-3 gap-4">
            <div>
              <label class="block font-semibold text-gray-700 text-sm">Mid-Sem (30)</label>
              <input type="number" id="fac-mid" max="30" min="0" required class="w-full p-2 border border-gray-300 rounded mt-1">
            </div>
            <div>
              <label class="block font-semibold text-gray-700 text-sm">Internal (20)</label>
              <input type="number" id="fac-internal" max="20" min="0" required class="w-full p-2 border border-gray-300 rounded mt-1">
            </div>
            <div>
              <label class="block font-semibold text-gray-700 text-sm">GTU Exam (70)</label>
              <input type="number" id="fac-gtu" max="70" min="0" required class="w-full p-2 border border-gray-300 rounded mt-1">
            </div>
          </div>

          <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-bold px-6 py-2 rounded shadow">
            Save & Update Marks
          </button>
        </form>
      </div>
    </div>

  </div>

  <script>
    // Sample Initial Data Structure
    let studentData = {
      1: [
        { code: "3110014", name: "Mathematics-1", mid: 10, internal: 12, gtu: 35 },
        { code: "3110005", name: "Basic Electrical Eng", mid: 22, internal: 16, gtu: 45 }
      ],
      2: [
        { code: "3110015", name: "Mathematics-2", mid: 25, internal: 18, gtu: 50 }
      ],
      3: [], 4: [], 5: [], 6: []
    };

    let currentSem = 1;

    // Functions to switch between Student and Faculty View
    function switchRole(role) {
      if (role === 'student') {
        document.getElementById('student-view').classList.remove('hidden');
        document.getElementById('faculty-view').classList.add('hidden');
        document.getElementById('btn-student').className = "bg-white text-blue-800 px-4 py-2 rounded font-semibold shadow";
        document.getElementById('btn-faculty').className = "bg-blue-700 hover:bg-blue-600 px-4 py-2 rounded font-semibold";
      } else {
        document.getElementById('student-view').classList.add('hidden');
        document.getElementById('faculty-view').classList.remove('hidden');
        document.getElementById('btn-faculty').className = "bg-white text-blue-800 px-4 py-2 rounded font-semibold shadow";
        document.getElementById('btn-student').className = "bg-blue-700 hover:bg-blue-600 px-4 py-2 rounded font-semibold";
      }
    }

    // Function to render marks for selected semester
    function showSem(sem) {
      currentSem = sem;
      
      // Update Tab Styles
      document.querySelectorAll('.sem-tab').forEach(tab => {
        tab.className = "sem-tab bg-gray-200 text-gray-700 px-4 py-2 rounded-t font-semibold";
      });
      document.getElementById(`tab-${sem}`).className = "sem-tab bg-blue-600 text-white px-4 py-2 rounded-t font-semibold";

      const tableBody = document.getElementById('marks-table-body');
      tableBody.innerHTML = '';

      let list = studentData[sem] || [];
      let hasAtktRisk = false;

      if (list.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-500">No marks updated for Semester ${sem} yet.</td></tr>`;
      } else {
        list.forEach(item => {
          // Check ATKT Risk Condition (Mid-Sem < 12 OR Internal < 8)
          let isRisk = item.mid < 12 || item.internal < 8;
          if (isRisk) hasAtktRisk = true;

          let statusBadge = isRisk 
            ? `<span class="bg-red-500 text-white px-2 py-1 rounded text-xs font-bold">⚠️ High ATKT Risk</span>`
            : `<span class="bg-green-500 text-white px-2 py-1 rounded text-xs font-bold">Safe / Pass</span>`;

          tableBody.innerHTML += `
            <tr class="hover:bg-gray-50">
              <td class="p-3 font-medium">${item.code}</td>
              <td class="p-3">${item.name}</td>
              <td class="p-3 ${item.mid < 12 ? 'text-red-600 font-bold' : ''}">${item.mid} / 30</td>
              <td class="p-3 ${item.internal < 8 ? 'text-red-600 font-bold' : ''}">${item.internal} / 20</td>
              <td class="p-3">${item.gtu} / 70</td>
              <td class="p-3">${statusBadge}</td>
            </tr>
          `;
        });
      }

      // Show or Hide ATKT Risk Warning Box
      const riskBadge = document.getElementById('risk-badge');
      if (hasAtktRisk) {
        riskBadge.classList.remove('hidden');
      } else {
        riskBadge.classList.add('hidden');
      }
    }

    // Function for Faculty to Save/Update Marks
    function saveMarks(e) {
      e.preventDefault();
      let sem = document.getElementById('fac-sem').value;
      let subject = document.getElementById('fac-subject').value;
      let mid = parseInt(document.getElementById('fac-mid').value);
      let internal = parseInt(document.getElementById('fac-internal').value);
      let gtu = parseInt(document.getElementById('fac-gtu').value);

      if (!studentData[sem]) studentData[sem] = [];

      studentData[sem].push({
        code: "SUB" + Math.floor(100 + Math.random() * 900),
        name: subject,
        mid: mid,
        internal: internal,
        gtu: gtu
      });

      alert("Marks saved successfully!");
      document.getElementById('mark-entry-form').reset();
      switchRole('student');
      showSem(sem);
    }

    // Initial Load
    showSem(1);
  </script>

</body>
</html>
